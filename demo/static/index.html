<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oasis: office-to-apartment conversions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="Oasis home">
    <svg role="img" aria-label="Oasis logo" width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="17" fill="#0B6E61"/><path d="M11 25V15l4-2.5V25M17 25V10l8 3.5V25" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M8 25h20" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="brand-name">Oasis</span>
    <span class="pill">Houston, TX</span>
  </a>
  <div class="top-right">
    <span>Welcome back</span>
    <button class="avatar" id="profileBtn" aria-label="Open profile and data sources" aria-expanded="false" data-act="profile"></button>
    <div class="popover" id="profilePop" hidden></div>
  </div>
</header>

<main class="layout" id="layout">
  <aside class="side" id="side" aria-label="Details">
    <div class="search-row">
      <button class="icon-btn" data-act="toggle-full" aria-label="Hide sidebar and expand the map" id="menuBtn"></button>
      <label class="search">
        <span class="sr">Search buildings</span>
        <span id="searchIcon"></span>
        <input type="search" id="q" placeholder="Search an address or building" autocomplete="off">
      </label>
      <button class="icon-btn" data-act="toggle-filters" aria-label="Filter by what is nearby" aria-expanded="false" id="filterBtn"></button>
    </div>
    <div id="panel" class="panel"></div>
  </aside>

  <section class="mapwrap" id="mapwrap" aria-label="3D map of Houston office buildings">
    <div id="map"></div>
    <div id="mapui"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
