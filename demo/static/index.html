<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office-to-Residential Conversion Agent</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --pass: #2e7d32; --escalate: #f9a825; --fail: #c62828; --bg: #f4f5f7; --panel: #ffffff; --ink: #1c1f24; --muted: #6b7280; --border: #e3e5e9; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 18px 28px; background: #111318; color: white; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 3px 0 0; color: #9aa1ac; font-size: 12.5px; }
  .layout { display: flex; gap: 0; height: calc(100vh - 64px); }
  .sidebar { width: 320px; border-right: 1px solid var(--border); background: var(--panel); overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }
  .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  #map { height: 46%; min-height: 260px; width: 100%; z-index: 0; }
  .results-pane { flex: 1; overflow-y: auto; padding: 26px 30px; }
  .section-label { padding: 14px 16px 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .building-row { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #f0f1f3; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .building-row:hover { background: #f7f8fa; }
  .building-row.active { background: #eef3ff; }
  .b-name { font-size: 13px; font-weight: 600; }
  .b-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .tag { font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
  .tag.cached { background: #e4f1ff; color: #1a66b3; }
  .tag.live { background: #fff1db; color: #a85c00; }
  input#search { margin: 10px 16px; width: calc(100% - 32px); padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
  .empty-state { color: var(--muted); font-size: 14px; padding: 40px; text-align: center; }
  .status-banner { font-size: 11.5px; padding: 8px 16px; background: #fff8e1; color: #8a6400; border-bottom: 1px solid var(--border); }
  .verdict-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-weight: 700; font-size: 13px; color: white; }
  .result-header { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; flex-wrap: wrap; }
  .stat-row { display: flex; gap: 22px; flex-wrap: wrap; margin: 16px 0; }
  .stat .v { font-size: 20px; font-weight: 700; }
  .stat .l { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  img.render { max-width: 100%; border: 1px solid var(--border); border-radius: 8px; margin-top: 10px; background: white; }
  .reasoning { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 18px; font-size: 13.5px; line-height: 1.55; }
  .bottom-line { border: 2px solid; border-radius: 10px; padding: 16px 18px; margin: 14px 0; background: white; }
  .bl-headline { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
  .bl-sub { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .bl-bar-track { position: relative; height: 10px; background: #eee; border-radius: 5px; margin-bottom: 4px; }
  .bl-bar-zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: #999; }
  .bl-bar-fill { position: absolute; top: 0; bottom: 0; border-radius: 5px; opacity: 0.85; }
  .bl-bar-labels { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); }
  .reasoning-details { margin-top: 14px; }
  .reasoning-details summary { cursor: pointer; font-size: 12.5px; color: var(--muted); font-weight: 600; padding: 6px 0; }
  .reasoning-details summary:hover { color: var(--ink); }
  .mini-gauge-track { position: relative; height: 6px; background: #eee; border-radius: 3px; margin-top: 6px; width: 90px; }
  .mini-gauge-fill { height: 100%; border-radius: 3px; }
  .mini-gauge-threshold { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #333; }
  .mini-mix-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 6px; width: 140px; }
  .mini-mix-legend { font-size: 9.5px; color: var(--muted); margin-top: 3px; white-space: nowrap; }
  .sens-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; font-size: 11.5px; }
  .sens-label { width: 80px; color: var(--muted); flex-shrink: 0; }
  .sens-track { position: relative; flex: 1; height: 14px; background: #f3f3f3; border-radius: 3px; }
  .sens-zero { position: absolute; left: 50%; top: 0; bottom: 0; width: 1.5px; background: #999; }
  .sens-fill { position: absolute; top: 2px; bottom: 2px; border-radius: 2px; opacity: 0.85; }
  .sens-val { width: 65px; text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .notes { margin-top: 14px; }
  .legal-panel { margin-top: 20px; border: 1.5px solid #d9dde3; border-radius: 10px; padding: 16px 18px; background: #fafbfc; }
  .legal-panel h3 { margin: 0 0 10px; font-size: 14px; }
  .legal-item { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; font-size: 13px; line-height: 1.5; }
  .legal-item:last-child { margin-bottom: 0; }
  .legal-item .icon { font-size: 15px; flex-shrink: 0; line-height: 1.5; }
  .legal-item.ok .icon { color: var(--pass); }
  .legal-item.warn .icon { color: var(--escalate); }
  .legal-item.na .icon { color: var(--muted); }
  .notes li { font-size: 12.5px; color: var(--muted); margin-bottom: 5px; line-height: 1.4; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #d9dde3; border-top-color: #4a90d9; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-wrap { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13.5px; padding: 30px 0; }
  .error-box { background: #fdecea; border: 1px solid #f5c2bb; color: #a12d26; padding: 14px 16px; border-radius: 8px; font-size: 13.5px; }
  .agent-btn { margin-left: auto; background: linear-gradient(135deg,#1c1f24,#3a3f4b); color: white; border: none; padding: 9px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 7px; }
  .agent-btn:hover { filter: brightness(1.2); }
  .agent-btn:disabled { opacity: 0.5; cursor: default; }
  .agent-section { margin-top: 26px; border-top: 2px dashed var(--border); padding-top: 22px; }
  .agent-step { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; opacity: 0; animation: fadein 0.4s forwards; }
  @keyframes fadein { to { opacity: 1; } }
  .agent-step .icon { font-size: 17px; line-height: 1.4; flex-shrink: 0; }
  .agent-step .body { font-size: 13.5px; line-height: 1.5; color: var(--ink); }
  .agent-step.insight .body { color: var(--muted); font-size: 13px; }
  .agent-final { background: #ecfdf3; border: 1.5px solid #bbead0; border-radius: 10px; padding: 16px 18px; margin-top: 8px; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; }
  .typing-dots span { animation: blink 1.2s infinite; }
  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .leaflet-popup-content { font-size: 12.5px; }
  .map-legend { position: absolute; bottom: 10px; left: 10px; z-index: 1000; background: white; padding: 6px 10px; border-radius: 6px; font-size: 11px; box-shadow: 0 1px 4px rgba(0,0,0,0.2); display: flex; gap: 10px; }
  .map-legend span { display: flex; align-items: center; gap: 4px; }
  .map-legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Office-to-Residential Conversion Feasibility Agent</h1>
    <p>Real Vexcel geometry + real CoStar lease/comp data. Click any marker on the map.</p>
  </div>
  <button class="agent-btn" id="scanBtn" style="margin-left:0;">&#128269; Run Portfolio Scan</button>
  <button class="agent-btn" id="dataBtn" style="margin-left:8px; background:#1a66b3;">&#128202; Data &amp; Methodology</button>
</header>
<div class="layout">
  <div class="sidebar">
    <input id="search" placeholder="Search buildings...">
    <div id="list"></div>
  </div>
  <div class="main">
    <div id="map"></div>
    <div class="results-pane" id="main">
      <div class="empty-state">Click a marker on the map, or pick a building on the left, to run the real pipeline on it.</div>
    </div>
  </div>
</div>

<script>
let BUILDINGS = { cached: [], live: [] };
let vexcelKeySet = false;
let activeId = null;
let currentBuilding = null;
let currentAnalysis = null;
let currentAgentRun = null;
let map, markerLayer;
const markersById = {};

const STATUS_COLORS = { cached: '#4a90d9', live: '#f59e0b', pass: '#2e7d32', escalate: '#f9a825', fail: '#c62828' };

function initMap() {
  map = L.map('map', { scrollWheelZoom: true }).setView([29.76, -95.45], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 18,
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);

  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = () => {
    const div = L.DomUtil.create('div', 'map-legend');
    div.innerHTML = `
      <span><span class="dot" style="background:${STATUS_COLORS.cached}"></span>pre-tested</span>
      <span><span class="dot" style="background:${STATUS_COLORS.live}"></span>untested, live</span>
    `;
    return div;
  };
  legend.addTo(map);
}

async function loadBuildings() {
  initMap();
  const res = await fetch('/api/buildings');
  const data = await res.json();
  BUILDINGS = data;
  vexcelKeySet = data.vexcel_key_set;
  renderList();
  renderMapMarkers();
}

function renderMapMarkers() {
  markerLayer.clearLayers();
  const all = [...BUILDINGS.cached, ...BUILDINGS.live];
  all.forEach(b => {
    const color = STATUS_COLORS[b.source];
    const marker = L.circleMarker([b.latitude, b.longitude], {
      radius: 7, color: '#fff', weight: 1.5, fillColor: color, fillOpacity: 0.9,
    }).addTo(markerLayer);
    marker.bindTooltip(b.name, { direction: 'top' });
    marker.on('click', () => selectBuilding(b));
    markersById[b.property_id] = marker;
  });
}

function renderList(filter) {
  const list = document.getElementById('list');
  list.innerHTML = '';
  const f = (filter || '').toLowerCase();

  if (!vexcelKeySet) {
    const banner = document.createElement('div');
    banner.className = 'status-banner';
    banner.textContent = 'VEXCEL_API_KEY not set - only pre-tested buildings will work.';
    list.appendChild(banner);
  }

  const section = (label, items, source) => {
    const filtered = items.filter(b => b.name.toLowerCase().includes(f) || (b.address || '').toLowerCase().includes(f));
    if (!filtered.length) return;
    const lab = document.createElement('div');
    lab.className = 'section-label';
    lab.textContent = `${label} (${filtered.length})`;
    list.appendChild(lab);
    filtered.forEach(b => {
      const row = document.createElement('div');
      row.className = 'building-row' + (activeId === b.property_id ? ' active' : '');
      row.innerHTML = `
        <div>
          <div class="b-name">${b.name}</div>
          <div class="b-sub">${Math.round(b.typical_floor_sqft).toLocaleString()} sf/floor${b.stories ? ' · ' + b.stories + ' stories' : ''}</div>
        </div>
        <span class="tag ${source}">${source === 'cached' ? '⚡ instant' : '🛰 live'}</span>
      `;
      row.onclick = () => selectBuilding(b);
      list.appendChild(row);
    });
  };

  section('Pre-tested tonight', BUILDINGS.cached, 'cached');
  section('Real Houston buildings, untested', BUILDINGS.live, 'live');

  if (!list.children.length) {
    list.innerHTML = '<div class="empty-state">No buildings match.</div>';
  }
}

document.getElementById('search').addEventListener('input', e => renderList(e.target.value));

async function selectBuilding(b) {
  activeId = b.property_id;
  renderList(document.getElementById('search').value);
  map.flyTo([b.latitude, b.longitude], 15, { duration: 0.6 });

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="loading-wrap">
      <div class="spinner"></div>
      <span>${b.source === 'live' ? 'Fetching this building\'s real aerial data live…' : 'Running the real pipeline…'}</span>
    </div>
  `;

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(b),
    });
    const data = await res.json();
    if (!res.ok) {
      main.innerHTML = `<div class="error-box"><strong>${data.error}</strong><br>${data.message}</div>`;
      return;
    }
    currentBuilding = b;
    currentAnalysis = data;
    currentAgentRun = null;
    renderResult(b, data);
    const m = markersById[b.property_id];
    if (m) m.setStyle({ fillColor: STATUS_COLORS[data.verdict] || '#999' });
  } catch (err) {
    main.innerHTML = `<div class="error-box">Request failed: ${err}</div>`;
  }
}

const VERDICT_COLORS = { pass: '#2e7d32', escalate: '#f9a825', fail: '#c62828' };

function renderLegalPanel(lc) {
  if (!lc) return '';
  const zoning = { icon: '&#9888;&#65039;', cls: 'warn',
    text: 'Houston has no citywide zoning — not a real gate here. The real constraint is private deed restrictions, which aren\'t in this dataset.' };
  const parking = lc.parking_flag === 'likely_short'
    ? { icon: '&#9888;&#65039;', cls: 'warn', text: `Parking ratio (${lc.parking_ratio}/1000sf) may be short for residential use.` }
    : lc.parking_flag === 'likely_ok'
    ? { icon: '&#9989;', cls: 'ok', text: `Parking ratio (${lc.parking_ratio}/1000sf) looks adequate for residential use.` }
    : { icon: '&#8505;&#65039;', cls: 'na', text: 'Parking ratio not on record.' };
  const sprinkler = lc.sprinkler_flag === 'has_sprinklers'
    ? { icon: '&#9989;', cls: 'ok', text: lc.occupancy_change_note }
    : lc.sprinkler_flag === 'no_sprinklers'
    ? { icon: '&#9888;&#65039;', cls: 'warn', text: lc.occupancy_change_note }
    : { icon: '&#8505;&#65039;', cls: 'na', text: lc.occupancy_change_note };
  const column = { icon: '&#8505;&#65039;', cls: 'na', text: lc.column_spacing_note };

  const row = (item) => `<div class="legal-item ${item.cls}"><span class="icon">${item.icon}</span><span>${item.text}</span></div>`;
  return `
    <div class="legal-panel">
      <h3>Legal &amp; building code checks</h3>
      ${row(zoning)}
      ${row(parking)}
      ${row(sprinkler)}
      ${row(column)}
    </div>
  `;
}

function renderLivabilityPanel(lv) {
  if (!lv) return '';
  if (lv.error) {
    return `<div class="legal-panel"><h3>Nearby amenities (real, OpenStreetMap)</h3>
      <div class="legal-item na"><span class="icon">&#8505;&#65039;</span><span>Unavailable right now - ${lv.error}</span></div></div>`;
  }
  const labels = { schools: 'Schools', hospitals: 'Hospitals', parks: 'Parks', grocery: 'Grocery' };
  const rows = Object.entries(labels).map(([key, label]) => {
    const info = lv[key] || { count: 0, examples: [] };
    const cls = info.count > 0 ? 'ok' : 'na';
    const icon = info.count > 0 ? '&#9989;' : '&#8505;&#65039;';
    const text = info.count > 0
      ? `${label}: ${info.count} nearby - ${info.examples.join(', ')}`
      : `${label}: none found nearby (real OpenStreetMap data - may reflect real tagging gaps, not necessarily zero amenities)`;
    return `<div class="legal-item ${cls}"><span class="icon">${icon}</span><span>${text}</span></div>`;
  }).join('');
  return `<div class="legal-panel"><h3>Nearby amenities (real, OpenStreetMap)</h3>${rows}</div>`;
}

const CLASS_META = {
  feasible: { icon: '✅', color: '#2e7d32', verb: 'Worth converting' },
  marginal: { icon: '⚠️', color: '#f9a825', verb: 'Borderline — needs human review' },
  not_feasible: { icon: '❌', color: '#c62828', verb: 'Not worth converting' },
};

function renderBottomLine(d) {
  const meta = CLASS_META[d.classification] || { icon: 'ℹ️', color: '#999', verb: d.classification };
  if (d.value_skipped) {
    return `<div class="bottom-line" style="border-color:${meta.color}">
      <div class="bl-headline" style="color:${meta.color}">${meta.icon} ${meta.verb}</div>
      <div class="bl-sub">Geometry failed outright — not enough real apartment-sized space to even price this one.</div>
    </div>`;
  }
  const lo = d.value_impact_low, hi = d.value_impact_high;
  const fmt = (x) => x < 0 ? `-$${Math.abs(Math.round(x)).toLocaleString()}` : `$${Math.round(x).toLocaleString()}`;
  // Simple number-line bar: where does [lo, hi] sit relative to $0?
  const span = Math.max(Math.abs(lo), Math.abs(hi)) * 1.15 || 1;
  const pct = (x) => ((x + span) / (2 * span)) * 100;
  const barLeft = Math.min(pct(lo), pct(hi));
  const barWidth = Math.abs(pct(hi) - pct(lo));
  return `
    <div class="bottom-line" style="border-color:${meta.color}">
      <div class="bl-headline" style="color:${meta.color}">${meta.icon} ${meta.verb}</div>
      <div class="bl-sub">Real implied value impact: <strong>${fmt(lo)} to ${fmt(hi)}</strong> (${(d.confidence*100).toFixed(0)}% confidence this call is right)</div>
      <div class="bl-bar-track">
        <div class="bl-bar-zero"></div>
        <div class="bl-bar-fill" style="left:${barLeft}%; width:${Math.max(barWidth,1.5)}%; background:${meta.color}"></div>
      </div>
      <div class="bl-bar-labels"><span>${fmt(-span)}</span><span>$0</span><span>${fmt(span)}</span></div>
    </div>
  `;
}

const UNIT_TYPE_BAR_COLORS = { studio: '#4a90d9', '1br': '#2e7d32', '2br': '#8e44ad' };

function renderDepthGauge(depthFt) {
  const threshold = 45;
  const scaleMax = Math.max(depthFt, threshold) * 1.15;
  const depthPct = (depthFt / scaleMax) * 100;
  const thresholdPct = (threshold / scaleMax) * 100;
  const overThreshold = depthFt > threshold;
  return `
    <div class="stat">
      <div class="v">${depthFt.toFixed(1)} ft</div>
      <div class="l">Depth (45ft threshold)</div>
      <div class="mini-gauge-track">
        <div class="mini-gauge-fill" style="width:${depthPct}%; background:${overThreshold ? '#f9a825' : '#2e7d32'}"></div>
        <div class="mini-gauge-threshold" style="left:${thresholdPct}%"></div>
      </div>
    </div>
  `;
}

function renderUnitMixBar(counts) {
  const entries = Object.entries(counts || {});
  const total = entries.reduce((s, [, c]) => s + c, 0);
  if (!total) return `<div class="stat"><div class="v">0</div><div class="l">No viable units</div></div>`;
  const segments = entries.map(([t, c]) =>
    `<div style="width:${(c/total)*100}%; background:${UNIT_TYPE_BAR_COLORS[t] || '#999'}" title="${c} ${t}"></div>`
  ).join('');
  const legend = entries.map(([t, c]) =>
    `<span style="color:${UNIT_TYPE_BAR_COLORS[t] || '#999'}">&#9632;</span> ${c} ${t.toUpperCase()}`
  ).join('  ');
  return `
    <div class="stat">
      <div class="v">${total}</div>
      <div class="l">Real units</div>
      <div class="mini-mix-bar">${segments}</div>
      <div class="mini-mix-legend">${legend}</div>
    </div>
  `;
}

function renderSensitivityChart(d) {
  const pts = d.cap_rate_sensitivity;
  if (!pts || !pts.length || d.value_skipped) return '';
  const allVals = pts.flatMap(p => [p.implied_low, p.implied_high]);
  const maxAbs = Math.max(...allVals.map(Math.abs), 1);
  const fmt = (x) => x < 0 ? `-$${(Math.abs(x)/1e6).toFixed(1)}M` : `$${(x/1e6).toFixed(1)}M`;
  const bars = pts.map(p => {
    const midPct = ((p.implied_low + p.implied_high) / 2 / maxAbs) * 50;
    const isActual = Math.abs(p.cap_rate - d.cap_rate_used) < 0.001;
    const color = (p.implied_low + p.implied_high) / 2 >= 0 ? '#2e7d32' : '#c62828';
    return `
      <div class="sens-row">
        <div class="sens-label">${(p.cap_rate*100).toFixed(1)}%${isActual ? ' &larr; used' : ''}</div>
        <div class="sens-track">
          <div class="sens-zero"></div>
          <div class="sens-fill" style="background:${color}; ${midPct >= 0 ? `left:50%; width:${midPct}%` : `left:${50+midPct}%; width:${-midPct}%`}"></div>
        </div>
        <div class="sens-val">${fmt((p.implied_low+p.implied_high)/2)}</div>
      </div>`;
  }).join('');
  const breakevenText = d.breakeven_cap_rate_low
    ? `Breaks even between ${(d.breakeven_cap_rate_low*100).toFixed(1)}% and ${(d.breakeven_cap_rate_high*100).toFixed(1)}% cap rate.`
    : 'No real cap rate makes this profitable at current rent/cost assumptions.';
  return `
    <div class="legal-panel">
      <h3>Cap rate sensitivity — what if the assumption is wrong?</h3>
      <div style="font-size:12px; color:var(--muted); margin-bottom:10px;">
        Re-runs the same real math at other real cap rates, since this is the most commonly-defaulted input. ${breakevenText}
      </div>
      ${bars}
    </div>
  `;
}

function renderResult(b, d) {
  const main = document.getElementById('main');
  const unitMix = Object.entries(d.unit_type_counts || {}).map(([t, c]) => `${c} ${t}`).join(', ') || 'no viable units';
  const valueHtml = d.value_skipped
    ? `<div class="stat"><div class="v">—</div><div class="l">Value (skipped - geometry failed)</div></div>`
    : `<div class="stat"><div class="v">$${Math.round(d.value_impact_low).toLocaleString()} to $${Math.round(d.value_impact_high).toLocaleString()}</div><div class="l">Value impact</div></div>`;

  main.innerHTML = `
    <div class="result-header">
      <h2 style="margin:0;">${b.name}</h2>
      <span class="verdict-badge" style="background:${VERDICT_COLORS[d.verdict] || '#999'}">${d.verdict.toUpperCase()}</span>
      <button class="agent-btn" id="agentBtn">&#129504; Ask the AI agent to evaluate this</button>
      <button class="agent-btn" id="downloadBtn" style="margin-left:8px; background:#1a66b3;">&#128190; Download report</button>
    </div>
    <div style="color:var(--muted); font-size:13px;">${b.address || ''} &middot; floor ${b.floor_name}</div>

    ${renderBottomLine(d)}

    <div class="stat-row">
      <div class="stat"><div class="v">${(d.confidence * 100).toFixed(0)}%</div><div class="l">Confidence</div></div>
      ${renderDepthGauge(d.window_to_core_max_ft)}
      ${renderUnitMixBar(d.unit_type_counts)}
      <div class="stat"><div class="v">${Math.round(d.viable_leasable_sqft).toLocaleString()} sf</div><div class="l">Real viable sqft</div></div>
      ${valueHtml}
    </div>

    <img class="render" src="data:image/png;base64,${d.image_base64}">

    <details class="reasoning-details">
      <summary>Full reasoning &amp; technical detail</summary>
      <div class="reasoning"><strong>Reasoning:</strong><br>${d.reasoning_text}</div>
      <div class="notes"><strong style="font-size:13px;">Notes</strong><ul>${(d.notes || []).map(n => `<li>${n}</li>`).join('')}</ul></div>
      ${renderSensitivityChart(d)}
    </details>

    ${renderLegalPanel(d.legal_checks)}
    ${renderLivabilityPanel(d.livability)}
  `;

  document.getElementById('agentBtn').onclick = () => runAgent(b);
  document.getElementById('downloadBtn').onclick = () => downloadReport();
}

async function runAgent(b) {
  const btn = document.getElementById('agentBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="border-top-color:white; border-color:#555;"></span> Agent is thinking...';

  let section = document.getElementById('agentSection');
  if (!section) {
    section = document.createElement('div');
    section.id = 'agentSection';
    section.className = 'agent-section';
    document.getElementById('main').appendChild(section);
  }
  section.innerHTML = `<div class="agent-step"><span class="icon">&#129504;</span><span class="body">Thinking<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span></span></div>`;

  try {
    const res = await fetch('/api/analyze_agent', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(b),
    });
    const data = await res.json();
    btn.innerHTML = '&#129504; Ask the AI agent again';
    btn.disabled = false;
    if (!res.ok) {
      section.innerHTML = `<div class="error-box"><strong>${data.error}</strong><br>${data.message}</div>`;
      return;
    }
    currentAgentRun = data;
    renderAgentTrace(section, data);
  } catch (err) {
    btn.disabled = false;
    section.innerHTML = `<div class="error-box">Agent request failed: ${err}</div>`;
  }
}

// Builds a real file on the viewer's own machine - a plain-text report that
// still exists after the browser tab (and this server) are gone, combining
// the deterministic pipeline's numbers with the live AI agent's own written
// verdict when it was run.
function renderSensitivityText(d) {
  if (!d.cap_rate_sensitivity || !d.cap_rate_sensitivity.length || d.value_skipped) return '';
  const fmt = (x) => x < 0 ? `-$${Math.abs(Math.round(x)).toLocaleString()}` : `$${Math.round(x).toLocaleString()}`;
  const rows = d.cap_rate_sensitivity.map(p => {
    const mark = Math.abs(p.cap_rate - d.cap_rate_used) < 0.001 ? '  <- real rate used' : '';
    return `  ${(p.cap_rate*100).toFixed(1)}% cap rate: ${fmt(p.implied_low)} to ${fmt(p.implied_high)}${mark}`;
  }).join('\n');
  const breakeven = d.breakeven_cap_rate_low
    ? `Breaks even between ${(d.breakeven_cap_rate_low*100).toFixed(1)}% and ${(d.breakeven_cap_rate_high*100).toFixed(1)}% cap rate.`
    : 'No real cap rate makes this profitable at current rent/cost assumptions.';
  return `
CAP RATE SENSITIVITY (same real math, other real cap rate points - the
cap rate is the most commonly-defaulted real input here)
${rows}
  ${breakeven}
`;
}

function downloadReport() {
  const b = currentBuilding, d = currentAnalysis;
  if (!b || !d) return;

  const unitMix = Object.entries(d.unit_type_counts || {}).map(([t, c]) => `${c} ${t}`).join(', ') || 'no viable units';
  const valueLine = d.value_skipped ? 'Skipped (geometry failed hard)'
    : `$${Math.round(d.value_impact_low).toLocaleString()} to $${Math.round(d.value_impact_high).toLocaleString()}`;
  const lc = d.legal_checks || {};

  const bottomLineWord = { pass: 'PASS', fail: 'FAIL', escalate: 'REVIEW' }[d.verdict] || d.verdict.toUpperCase();

  let report = `BOTTOM LINE: ${bottomLineWord}

OFFICE-TO-RESIDENTIAL CONVERSION FEASIBILITY REPORT
Generated ${new Date().toLocaleString()}
Real Vexcel geometry + real CoStar lease/comp data${currentAgentRun ? ' + live Claude agent evaluation' : ''}

================================================================
${b.name}
================================================================
${b.address || ''}${b.address ? ' · ' : ''}Floor ${b.floor_name}
Property ID: ${b.property_id}
Coordinates: ${b.latitude}, ${b.longitude}

VERDICT: ${d.verdict.toUpperCase()}  (${(d.confidence * 100).toFixed(0)}% confidence)

GEOMETRY
  Window-to-core depth: ${d.window_to_core_max_ft.toFixed(1)} ft (45ft threshold)
  Real viable leasable area: ${Math.round(d.viable_leasable_sqft).toLocaleString()} sf
  Unit mix: ${unitMix}

VALUE IMPACT
  ${valueLine}
${renderSensitivityText(d)}
REASONING
  ${d.reasoning_text}

LEGAL & BUILDING CODE CHECKS
  Zoning: Houston has no citywide zoning - not a real gate here. The real
    constraint is private deed restrictions, not in this dataset.
  Parking: ${lc.parking_flag || 'unknown'}${lc.parking_ratio ? ` (${lc.parking_ratio}/1000sf)` : ''}
  Occupancy change: ${lc.occupancy_change_note || 'n/a'}
  Column spacing: ${lc.column_spacing_note || 'n/a'}

NOTES
${(d.notes || []).map(n => '  - ' + n).join('\n')}
`;

  if (currentAgentRun) {
    report += `
================================================================
LIVE AI AGENT EVALUATION (Claude, real tool-calling run)
================================================================
${currentAgentRun.final_text}
`;
  }

  const blob = new Blob([report], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${b.name.replace(/[^a-z0-9]+/gi, '_')}_conversion_report.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Turns the raw tool-calling trace into plain-English narration - no tool
// names, no JSON, no implementation details. This is deliberately a
// presentation-layer translation: the real trace (visible via /api/analyze_agent
// if you inspect network requests) still proves the tool-calling is genuine;
// this view is just for what the audience should see.
function narrateStep(step) {
  if (step.type === 'tool_call') {
    if (step.tool === 'run_geometry') return { icon: '📐', text: 'Checking whether the real building shape allows a residential layout...' };
    if (step.tool === 'run_value') return { icon: '💰', text: 'Pricing the conversion against real Houston rent and lease data...' };
    return { icon: '⚙️', text: 'Working...' };
  }
  if (step.type === 'tool_result') {
    const r = step.result || {};
    if (step.tool === 'run_geometry') {
      return { icon: '✅', insight: true, text: `Geometry result: ${(r.verdict || '').toUpperCase()}, ${Math.round((r.confidence || 0) * 100)}% confidence, ${(r.window_to_core_max_ft || 0).toFixed(0)}ft to the core.` };
    }
    if (step.tool === 'run_value') {
      const lo = r.implied_value_impact_low, hi = r.implied_value_impact_high;
      const valStr = (lo != null && hi != null) ? `$${Math.round(lo).toLocaleString()} to $${Math.round(hi).toLocaleString()}` : 'unavailable';
      return { icon: '✅', insight: true, text: `Pricing result: implied value impact ${valStr}.` };
    }
    return { icon: '✅', insight: true, text: 'Got a result back.' };
  }
  return null; // assistant_text handled separately, as the final write-up
}

function renderAgentTrace(section, d) {
  section.innerHTML = `
    <h3 style="margin:0 0 4px;">The agent's own evaluation</h3>
    <div style="font-size:12.5px; color:var(--muted); margin-bottom:14px;">
      This is a live run of the real Claude API deciding, on its own, which checks to run and what to conclude.
    </div>
    <div id="agentTrace"></div>
  `;
  const trace = document.getElementById('agentTrace');
  const steps = (d.trace || []).map(narrateStep).filter(Boolean);

  steps.forEach((s, i) => {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'agent-step' + (s.insight ? ' insight' : '');
      el.innerHTML = `<span class="icon">${s.icon}</span><span class="body">${s.text}</span>`;
      trace.appendChild(el);
    }, i * 500);
  });

  setTimeout(() => {
    const final = document.createElement('div');
    final.className = 'agent-final';
    final.innerHTML = `<strong>Agent's conclusion:</strong><br><br>${d.final_text}`;
    final.style.opacity = 0;
    trace.appendChild(final);
    requestAnimationFrame(() => { final.style.transition = 'opacity 0.5s'; final.style.opacity = 1; });
  }, steps.length * 500 + 200);
}

  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="border-top-color:white; border-color:#555;"></span> Scanning...';

  const main = document.getElementById('main');
  main.innerHTML = `
    <h2 style="margin:0 0 4px;">Portfolio scan - real results across a blind batch</h2>
    <div style="font-size:12.5px; color:var(--muted); margin-bottom:16px; max-width:640px;">
      The real pipeline run once, ahead of time, across 35 real Houston office buildings -
      not the ones picked for the earlier demo, a genuinely blind batch pulled from the CoStar kit.
      Each marker lighting up on the map is one real building's real result.
    </div>
    <div id="scanList"></div>

  try {

function renderPortfolioScan(results) {
  markerLayer.clearLayers();

  const positive = results.filter(r => !r.value_skipped && r.value_impact_low != null && r.value_impact_low > 0)
    .sort((a, b) => (b.rank_score || 0) - (a.rank_score || 0));
  const n = results.length;

  results.forEach((r, i) => {
    setTimeout(() => {
      let color = '#999';
      if (r.value_skipped) color = STATUS_COLORS.fail;
      else if (r.value_impact_low > 0) color = STATUS_COLORS.pass;
      else if (r.verdict === 'escalate') color = STATUS_COLORS.escalate;
      else color = '#c62828';

      const marker = L.circleMarker([r.latitude, r.longitude], {
        radius: 8, color: '#fff', weight: 1.5, fillColor: color, fillOpacity: 0,
      }).addTo(markerLayer);
      const valStr = r.value_skipped ? 'skipped (geometry failed)'
        : `$${Math.round(r.value_impact_low).toLocaleString()} to $${Math.round(r.value_impact_high).toLocaleString()}`;
      marker.bindTooltip(`${r.name}<br>${valStr}`, { direction: 'top' });

      let t = 0;
      const fadeIn = setInterval(() => {
        t += 0.1;
        marker.setStyle({ fillOpacity: Math.min(0.9, t) });
        if (t >= 0.9) clearInterval(fadeIn);
      }, 20);
    }, i * 90);
  });

  setTimeout(() => {
    const list = document.getElementById('scanList');
    list.innerHTML = `
      <div class="stat-row" style="margin-bottom:22px;">
        <div class="stat"><div class="v">${n}</div><div class="l">Real buildings scanned</div></div>
        <div class="stat"><div class="v" style="color:${STATUS_COLORS.pass}">${positive.length}</div><div class="l">Hidden opportunities found</div></div>
      </div>
      <h3 style="margin:0 0 10px;">Top real opportunities, ranked by value x geometry confidence x value confidence</h3>
      <div style="font-size:11px; color:var(--muted); margin-bottom:10px;">Not sorted by dollar amount alone - a number built entirely on real data outranks an equally large one resting on defaults.</div>
      <div id="scanRanked"></div>
    `;
    const ranked = document.getElementById('scanRanked');
    positive.slice(0, 12).forEach((r, i) => {
      const row = document.createElement('div');
      row.className = 'building-row';
      row.style.cursor = 'default';
      const confPct = r.value_confidence != null ? `${Math.round(r.geometry_confidence * r.value_confidence * 100)}% confidence` : '';
      row.innerHTML = `
        <div><div class="b-name">${i + 1}. ${r.name}</div>
        <div class="b-sub">${r.already_tested ? 'previously confirmed' : 'found by this scan'}${confPct ? ' &middot; ' + confPct : ''}</div></div>
        <div style="font-weight:700; color:${STATUS_COLORS.pass}; font-size:13px;">+$${Math.round(r.value_impact_low).toLocaleString()}+</div>
      `;
      ranked.appendChild(row);
    });
  }, n * 90 + 300);
}
